name: SateRocket
version: '${project.version}'
main: org.satellite.progiple.saterocket.SateRocket
api-version: '1.16'
depend:
  - LunaSpring
  - NBTAPI
softdepend:
  - Vault
  - SateJewels
  - DecentHolograms
commands:
  saterocket:
    aliases:
      - sr
      - srocket
      - rocket
      - sater
permissions:
  saterocket.give:
    default: op
  saterocket.open:
    default: op
  saterocket.reload:
    default: op